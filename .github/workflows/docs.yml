# Publishes the Duik for EffectCraft user guide to GitHub Pages.
name: Publish user guide

on:
  push:
    branches: [duik-for-effectcraft]
    paths: ["Duik for EffectCraft/docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "Duik for EffectCraft/docs"
      - id: deployment
        uses: actions/deploy-pages@v4
